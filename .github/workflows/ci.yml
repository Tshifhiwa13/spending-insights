name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spending-insights .
      - name: Start container
        run: docker run -d --name app -p 8080:8080 spending-insights
      - name: Check the app responds
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not respond in time"
          docker logs app
          exit 1
      - name: Check security headers are sent
        run: |
          headers=$(curl -sI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -i "content-security-policy"
          echo "$headers" | grep -i "x-frame-options"
      - name: Check the container runs as a non-root user
        run: test "$(docker exec app id -u)" != "0"