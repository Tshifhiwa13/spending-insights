server {   
     listen 8080; 
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off; # Don't advertise the Nginx version.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. "always" also adds them to error responses.
    # Note: any add_header inside a location block would cancel all of these,
    # so caching below uses "expires" instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Built assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached
    # so users always get the latest version.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}